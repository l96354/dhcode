# ============================================================
# DHCode 兑换码插件配置
# 插件把「网页端」当作一台服务主机：只需配置 web-root（根目录），
# 其余文件均按该根目录下的相对路径定位，便于换域名/迁移。
# ============================================================

# ---------- 网页端服务主机 ----------
# 网页端根目录（网址里的任意前缀均可，如 https://你的域名 或
# https://你的域名/dh）。插件会按此根 + 下方相对路径拼出完整地址。
web-root: "https://你的域名/dh"  # ← 改成你的网页端根目录

# 兑换码数据文件（相对路径，基于 web-root）
config-path: "/config.json"

# 全局一次性码删除回调（相对路径，基于 web-root）
delete-path: "/cs/api/redeem_callback.php"

# 回调令牌：必须与站点 cs/config.php 的 callback_token 一致
delete-token: "CHANGE_ME_与网页端一致的令牌"

# 配置缓存秒数（减少对站点请求次数）
cache-seconds: 15

# 连接/读取超时（毫秒）
timeout-ms: 8000

# ---------- 共享密钥 ----------
# 必须与站点 cs/key.php 中的 K 完全一致。
# 用于：HMAC-SHA256 生成兑换码索引 + AES-256-CBC 解密奖励数据。
# 即使 config.json 泄露，没有本密钥也无法还原兑换码与奖励。
security:
  secret: "CHANGE_ME_填写与网页端一致的共享密钥"

# ---------- 数据文件（可选）----------
# 已使用记录文件：默认 plugins/DHCode/used.json，
# 如需自定义绝对路径可在此指定；留空则用默认位置。
# used-data-file: ""
